<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de Aviões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a07; --panel:#0a120d; --panel2:#0e1912; --line:#173322;
  --g:#3dff8a; --g2:#1fae5c; --g3:#0f5f33; --dim:#6f9c80; --txt:#cfe9d8;
  --amber:#ffb547; --red:#ff5d5d; --cyan:#5fe3ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;letter-spacing:.12em;color:var(--g);font-weight:700}
.badge{font-size:11px;padding:3px 8px;border:1px solid var(--g3);border-radius:3px;color:var(--dim)}
.badge.live{color:var(--g);border-color:var(--g2)}
.badge.demo{color:var(--amber);border-color:#7a5520}
.badge.err{color:var(--red);border-color:#6a2626}
.spacer{flex:1}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:0;min-height:calc(100vh - 46px)}
aside{background:var(--panel);padding:14px;overflow:auto}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
h2{font-size:11px;letter-spacing:.16em;color:var(--dim);margin:0 0 8px;font-weight:600;text-transform:uppercase}
.sec{margin-bottom:18px}
.ranges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ranges button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:9px 0;font:inherit;font-weight:600;border-radius:4px;cursor:pointer}
.ranges button.on{background:var(--g3);border-color:var(--g);color:#eafff1;box-shadow:0 0 10px rgba(61,255,138,.25)}
input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font:inherit;padding:7px 8px;border-radius:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.btn{width:100%;background:transparent;border:1px solid var(--g3);color:var(--g);font:inherit;padding:7px;border-radius:4px;cursor:pointer;margin-top:6px}
.btn:hover{background:var(--g3);color:#eafff1}
.small{font-size:11px;color:var(--dim);line-height:1.5}
.radar-wrap{position:relative;display:flex;align-items:center;justify-content:center;padding:12px;min-height:420px}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.hud{position:absolute;left:16px;bottom:12px;font-size:11px;color:var(--dim);line-height:1.6;pointer-events:none}
.hud b{color:var(--g)}
.list{width:100%;border-collapse:collapse;font-size:11.5px}
.list th{text-align:left;color:var(--dim);font-weight:600;padding:4px 4px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.08em}
.list td{padding:5px 4px;border-bottom:1px solid #0f2016;white-space:nowrap}
.list tr{cursor:pointer}
.list tr:hover td{background:#0f2016}
.list tr.sel td{background:#123321;color:#eafff1}
.cs{color:var(--g);font-weight:700}
.det-empty{color:var(--dim);line-height:1.6;padding-top:6px}
.det-head{border:1px solid var(--g3);background:var(--panel2);border-radius:6px;padding:12px;margin-bottom:12px}
.det-head .big{font-size:22px;font-weight:700;color:var(--g);letter-spacing:.06em}
.det-head .air{color:var(--txt);margin-top:2px}
.route{display:flex;align-items:center;gap:8px;margin-top:10px}
.route .ap{flex:1;min-width:0}
.route .code{font-size:18px;font-weight:700;color:#eafff1}
.route .nm{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route .arrow{color:var(--g2);font-size:18px}
.kv{width:100%;border-collapse:collapse}
.kv td{padding:5px 2px;border-bottom:1px solid #0f2016;vertical-align:top;font-size:12px}
.kv td:first-child{color:var(--dim);width:46%;padding-right:8px}
.kv tr.grp td{color:var(--g2);font-size:10px;letter-spacing:.16em;padding-top:14px;border-bottom:1px solid var(--line)}
.photo{width:100%;border-radius:4px;margin-bottom:10px;display:block}
.notice{margin:10px 16px 0;padding:10px 12px;border:1px solid #7a5520;background:#1a1307;color:#ffd79a;border-radius:5px;font-size:12px;line-height:1.5;display:none}
.toggle{display:flex;gap:6px;margin-top:6px}
.toggle button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font:inherit;padding:6px;border-radius:4px;cursor:pointer;font-size:11px}
.toggle button.on{color:var(--g);border-color:var(--g2)}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr;}
  aside.left{order:2;border-right:none;border-top:1px solid var(--line)}
  .radar-wrap{order:1;min-height:0;height:min(92vw,560px)}
  aside.right{order:3;border-left:none;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <h1>◉ RADAR · TRÁFEGO AÉREO</h1>
  <span id="modeBadge" class="badge">A iniciar…</span>
  <span class="spacer"></span>
  <span id="clock" class="small"></span>
</header>
<div id="notice" class="notice"></div>

<main class="layout">
  <aside class="left">
    <div class="sec">
      <h2>Alcance</h2>
      <div class="ranges" id="ranges">
        <button data-r="5">5 km</button>
        <button data-r="10" class="on">10 km</button>
        <button data-r="20">20 km</button>
        <button data-r="50">50 km</button>
      </div>
    </div>

    <div class="sec">
      <h2>Localização</h2>
      <div class="row2">
        <input id="lat" placeholder="Latitude" inputmode="decimal">
        <input id="lon" placeholder="Longitude" inputmode="decimal">
      </div>
      <button class="btn" id="applyLoc">Aplicar coordenadas</button>
      <button class="btn" id="gpsBtn">⌖ Usar a minha localização</button>
      <div class="small" id="locInfo" style="margin-top:6px"></div>
    </div>

    <div class="sec">
      <h2>Fonte de dados</h2>
      <div class="toggle">
        <button id="tLive">Real (ADS-B)</button>
        <button id="tDemo">Simulação</button>
      </div>
      <div class="small" id="srcInfo" style="margin-top:6px"></div>
    </div>

    <div class="sec">
      <h2>No alcance (<span id="count">0</span>)</h2>
      <table class="list">
        <thead><tr><th>CALLSIGN</th><th>ALT ft</th><th>RUMO</th><th>DIST</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </aside>

  <section class="radar-wrap" id="wrap">
    <canvas id="radar"></canvas>
    <div class="hud" id="hud"></div>
  </section>

  <aside class="right" id="details">
    <h2>Detalhes do avião</h2>
    <div class="det-empty">Toca num avião no radar (ou na lista) para ver toda a informação disponível.</div>
  </aside>
</main>

<script>
(() => {
'use strict';
// ---------- constantes / utilitários ----------
const KM_PER_NM = 1.852, FT_TO_M = 0.3048;
const SWEEP_PERIOD = 4000; // ms por volta
const REFRESH_MS = 10000;
const DEFAULT_CENTER = {lat:38.7223, lon:-9.1393, label:'Lisboa (exemplo)'};

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
function haversineKm(a,b){
  const R=6371, dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearingDeg(a,b){
  const y=Math.sin(toRad(b.lon-a.lon))*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lon-a.lon));
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function movePoint(p, brgDeg, km){
  const R=6371, d=km/R, b=toRad(brgDeg), la=toRad(p.lat), lo=toRad(p.lon);
  const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));
  const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));
  return {lat:toDeg(la2), lon:((toDeg(lo2)+540)%360)-180};
}
const CARD = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
const cardinal = d => CARD[Math.round(((d%360)+360)%360/22.5)%16];
const nf = (v,dec=0) => v==null||isNaN(v) ? '—' : Number(v).toLocaleString('pt-PT',{maximumFractionDigits:dec,minimumFractionDigits:dec});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const callsignOf = p => (p.flight||'').trim() || (p.r||'') || (p.hex||'').toUpperCase();
function altFt(p){ if(p.alt_baro==='ground') return 0; return typeof p.alt_baro==='number'?p.alt_baro:(typeof p.alt_geom==='number'?p.alt_geom:null); }
function altText(p){
  if(p.alt_baro==='ground') return 'No solo';
  const a=altFt(p); if(a==null) return '—';
  return `${nf(a)} ft (${nf(a*FT_TO_M)} m)`;
}

// companhias por prefixo ICAO (fallback se a API de rotas não responder)
const AIRLINES = {TAP:'TAP Air Portugal',RYR:'Ryanair',EZY:'easyJet',EJU:'easyJet Europe',EZS:'easyJet Switzerland',IBE:'Iberia',IBS:'Iberia Express',VLG:'Vueling',AEA:'Air Europa',BAW:'British Airways',SHT:'British Airways',AFR:'Air France',KLM:'KLM',DLH:'Lufthansa',SWR:'Swiss',AUA:'Austrian',UAE:'Emirates',QTR:'Qatar Airways',THY:'Turkish Airlines',WZZ:'Wizz Air',TRA:'Transavia',TVF:'Transavia France',SAT:'SATA Azores Airlines',RZO:'Azores Airlines',PGA:'Portugália',WHT:'White Airways',EVE:'EuroAtlantic',HFY:'Hi Fly',RAM:'Royal Air Maroc',UAL:'United',AAL:'American',DAL:'Delta',ITY:'ITA Airways',BEL:'Brussels Airlines',SAS:'SAS',NAX:'Norwegian',NOZ:'Norwegian',EXS:'Jet2',TOM:'TUI Airways',TUI:'TUI fly',ANE:'Air Nostrum',BTI:'airBaltic',LOG:'Loganair',EIN:'Aer Lingus',AZU:'Azul',TAM:'LATAM Brasil',GLO:'Gol',CFG:'Condor',EWG:'Eurowings',BCS:'European Air Transport (DHL)',FDX:'FedEx',UPS:'UPS',ETD:'Etihad',SVA:'Saudia',ELY:'El Al',VOE:'Volotea',BER:'Binter',IBB:'Binter Canarias',GBL:'GB Airways',EXV:'Exe Aviation',NJE:'NetJets Europe',VJT:'VistaJet',LBT:'Nouvelair',DAH:'Air Algérie',MAC:'Air Arabia Maroc',TUN:'Tunisair'};
const airlineFromCs = cs => /^[A-Z]{3}\d/.test(cs) ? (AIRLINES[cs.slice(0,3)]||null) : null;
const CATEGORY = {A0:'Sem info',A1:'Ligeiro (<7 t)',A2:'Pequeno (7–34 t)',A3:'Grande (34–136 t)',A4:'Grande, alta turbulência (B757)',A5:'Pesado (>136 t)',A6:'Alta performance',A7:'Helicóptero',B1:'Planador',B2:'Balão/dirigível',B4:'Ultraleve',B6:'Drone',C1:'Veículo de emergência',C2:'Veículo de serviço'};

// ---------- estado ----------
const S = {
  center: store.get('radar.center') || null,
  centerLabel: '',
  rangeKm: store.get('radar.range') || 10,
  mode: store.get('radar.mode') || 'live',
  planes: new Map(),   // hex -> {data, t0 (ms da posição), base:{lat,lon}}
  selected: null,
  source: null,
  routes: new Map(),   // callsign -> route obj | 'none' | 'pending'
  acinfo: new Map(),   // hex -> info | 'none' | 'pending'
  lastFetch: 0, liveFailed: false, fetching:false
};

// ---------- fontes de dados reais ----------
const SOURCES = [
  {name:'adsb.lol', url:(la,lo,nm)=>`https://api.adsb.lol/v2/point/${la}/${lo}/${nm}`},
  {name:'airplanes.live', url:(la,lo,nm)=>`https://api.airplanes.live/v2/point/${la}/${lo}/${nm}`},
  {name:'adsb.fi', url:(la,lo,nm)=>`https://opendata.adsb.fi/api/v2/lat/${la}/lon/${lo}/dist/${nm}`}
];
async function fetchJson(url, ms=8000){
  const ctl = new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  try{ const r=await fetch(url,{signal:ctl.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function fetchLive(){
  if(!S.center || S.fetching) return;
  S.fetching = true;
  const nm = Math.min(250, Math.ceil(S.rangeKm/KM_PER_NM)+2);
  const la=S.center.lat.toFixed(4), lo=S.center.lon.toFixed(4);
  const order = S.source ? [SOURCES.find(s=>s.name===S.source), ...SOURCES.filter(s=>s.name!==S.source)] : SOURCES;
  let ok=false;
  for(const src of order){
    try{
      const j = await fetchJson(src.url(la,lo,nm));
      const list = j.ac || j.aircraft || [];
      ingest(list, j.now ? j.now*(j.now>1e12?1:1000) : Date.now());
      S.source = src.name; ok=true; break;
    }catch(e){ /* tenta a próxima */ }
  }
  S.fetching=false;
  if(!ok){
    S.liveFailed = true;
    if(S.mode==='live'){
      showNotice('Não foi possível obter dados ADS-B reais neste visualizador (o acesso à internet a partir desta página está bloqueado ou as APIs não responderam). Passei para <b>modo simulação</b>. Para tráfego real, abre o ficheiro HTML diretamente num navegador.');
      setMode('demo', true);
    }
  } else { S.liveFailed=false; hideNotice(); }
  S.lastFetch = Date.now();
  updateBadge();
}
function ingest(list, now){
  const seen = new Set();
  for(const d of list){
    if(d.lat==null || d.lon==null) continue;
    const hex = d.hex; seen.add(hex);
    const age = (d.seen_pos ?? d.seen ?? 0)*1000;
    S.planes.set(hex, {data:d, t0: Date.now()-age, base:{lat:d.lat, lon:d.lon}});
  }
  for(const k of [...S.planes.keys()]) if(!seen.has(k)) S.planes.delete(k);
  if(S.selected && !S.planes.has(S.selected)) {/* mantém detalhes mas marca como perdido */}
}
// rota + companhia (adsbdb)
async function lookupRoute(cs){
  if(!cs || S.mode!=='live' || S.routes.has(cs)) return;
  S.routes.set(cs,'pending');
  try{
    const j = await fetchJson(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(cs)}`, 8000);
    const fr = j?.response?.flightroute;
    S.routes.set(cs, fr ? fr : 'none');
  }catch(e){ S.routes.set(cs,'none'); }
  renderList(); if(S.selected) renderDetails();
}
async function lookupAircraft(hex){
  if(!hex || S.mode!=='live' || S.acinfo.has(hex)) return;
  S.acinfo.set(hex,'pending');
  try{
    const j = await fetchJson(`https://api.adsbdb.com/v0/aircraft/${hex}`, 8000);
    S.acinfo.set(hex, j?.response?.aircraft || 'none');
  }catch(e){ S.acinfo.set(hex,'none'); }
  if(S.selected===hex) renderDetails();
}
let routeQueue = [];
setInterval(()=>{ const cs=routeQueue.shift(); if(cs) lookupRoute(cs); }, 400);

// ---------- simulação ----------
const DEMO_FLIGHTS = [
  ['TAP1352','LIS','Lisboa','OPO','Porto'],['RYR4KZ','STN','Londres Stansted','LIS','Lisboa'],
  ['EZY81TP','LGW','Londres Gatwick','FAO','Faro'],['IBE3102','MAD','Madrid','LIS','Lisboa'],
  ['VLG8471','BCN','Barcelona','LIS','Lisboa'],['TAP0201','LIS','Lisboa','EWR','Nova Iorque Newark'],
  ['UAE191','DXB','Dubai','LIS','Lisboa'],['AFR1024','CDG','Paris CDG','LIS','Lisboa'],
  ['DLH1166','FRA','Frankfurt','LIS','Lisboa'],['WZZ3561','BUD','Budapeste','FNC','Funchal'],
  ['RZO121','PDL','Ponta Delgada','LIS','Lisboa'],['TAP1661','LIS','Lisboa','PDL','Ponta Delgada'],
  ['KLM1693','AMS','Amesterdão','LIS','Lisboa'],['THY1755','IST','Istambul','LIS','Lisboa'],
  ['BAW500','LHR','Londres Heathrow','LIS','Lisboa'],['TRA6731','AMS','Amesterdão','FAO','Faro']
];
const DEMO_TYPES = [['A320','AIRBUS A-320'],['A20N','AIRBUS A-320neo'],['A21N','AIRBUS A-321neo'],['B738','BOEING 737-800'],['A333','AIRBUS A-330-300'],['B77W','BOEING 777-300ER'],['E195','EMBRAER ERJ-195'],['A319','AIRBUS A-319']];
function makeDemo(){
  S.planes.clear(); S.routes.clear(); S.acinfo.clear();
  const n = 9 + Math.floor(S.rangeKm/8);
  const pool = [...DEMO_FLIGHTS].sort(()=>Math.random()-.5).slice(0,Math.min(n,DEMO_FLIGHTS.length));
  pool.forEach((f,i)=>{
    const dist = Math.random()*S.rangeKm*1.05, brg = Math.random()*360;
    const pos = movePoint(S.center, brg, dist);
    const alt = Math.round((2000+Math.random()*36000)/100)*100;
    const climb = alt<12000 ? (Math.random()<.5?1:-1)*Math.round(600+Math.random()*1800) : (Math.random()<.7?0:Math.round((Math.random()-.5)*2000));
    const gs = alt<10000 ? 180+Math.random()*90 : 380+Math.random()*110;
    const ty = DEMO_TYPES[i%DEMO_TYPES.length];
    const hex = Math.floor(0x490000+Math.random()*0xFFFF).toString(16);
    const d = {hex, type:'adsb_icao', flight:f[0].padEnd(8,' '), r:'CS-T'+String.fromCharCode(65+i%26)+String.fromCharCode(65+(i*7)%26)+String.fromCharCode(65+(i*3)%26), t:ty[0], desc:ty[1],
      alt_baro:alt, alt_geom:alt+125, gs:Math.round(gs), ias:Math.round(gs*.8), tas:Math.round(gs*.97), mach: alt>20000?+(0.70+Math.random()*.12).toFixed(3):undefined,
      track:+(Math.random()*360).toFixed(1), baro_rate:climb, squawk:String(1000+Math.floor(Math.random()*6000)).replace(/[89]/g,'7'),
      category: ty[0].startsWith('B77')||ty[0].startsWith('A33')?'A5':'A3', nav_qnh:1013.2, nav_altitude_mcp: Math.round(alt/1000)*1000,
      lat:pos.lat, lon:pos.lon, seen:0.3, seen_pos:0.5, messages:Math.floor(5000+Math.random()*90000), rssi:+(-30+Math.random()*-10).toFixed(1), _demo:true};
    S.planes.set(hex,{data:d, t0:Date.now(), base:{lat:pos.lat,lon:pos.lon}});
    S.routes.set(f[0], {callsign:f[0], airline:{name:airlineFromCs(f[0])||'—'}, origin:{iata_code:f[1], municipality:f[2]}, destination:{iata_code:f[3], municipality:f[4]}});
  });
}
function demoTick(){
  // renova aviões que saem bem para fora do alcance
  for(const [hex,pl] of S.planes){
    const pos = livePos(pl);
    if(haversineKm(S.center,pos) > S.rangeKm*1.4){
      const brg = (pl.data.track+180+ (Math.random()-.5)*60)%360;
      const np = movePoint(S.center, brg, S.rangeKm*1.15);
      pl.base = np; pl.t0 = Date.now(); pl.data.lat=np.lat; pl.data.lon=np.lon;
    } else { pl.base = pos; pl.t0 = Date.now(); pl.data.lat=pos.lat; pl.data.lon=pos.lon; }
    if(pl.data.baro_rate && typeof pl.data.alt_baro==='number'){
      pl.data.alt_baro = Math.max(1000, Math.min(41000, pl.data.alt_baro + pl.data.baro_rate*(REFRESH_MS/60000)));
      pl.data.alt_geom = pl.data.alt_baro+125;
    }
    pl.data.messages += Math.floor(Math.random()*40);
  }
}

// posição estimada (dead-reckoning) entre atualizações
function livePos(pl){
  const d=pl.data;
  if(!d.gs || d.track==null || d.alt_baro==='ground') return pl.base;
  const dt = Math.min(60, (Date.now()-pl.t0)/1000);
  return movePoint(pl.base, d.track, d.gs*KM_PER_NM*dt/3600);
}

// ---------- vista ----------
function visiblePlanes(){
  const out=[];
  if(!S.center) return out;
  for(const [hex,pl] of S.planes){
    const pos = livePos(pl);
    const dist = haversineKm(S.center,pos);
    if(dist<=S.rangeKm) out.push({hex, pl, pos, dist, brg:bearingDeg(S.center,pos)});
  }
  return out.sort((a,b)=>a.dist-b.dist);
}
function routeFor(cs){ const r=S.routes.get(cs); return (r && typeof r==='object') ? r : null; }
function airlineName(cs){ return routeFor(cs)?.airline?.name || airlineFromCs(cs) || null; }

function renderList(){
  const vis = visiblePlanes();
  $('count').textContent = vis.length;
  const rows = vis.map(v=>{
    const d=v.pl.data, cs=callsignOf(d), r=routeFor(cs);
    const od = r ? `${r.origin?.iata_code||'?'}→${r.destination?.iata_code||'?'}` : '';
    const a = d.alt_baro==='ground' ? 'SOLO' : nf(altFt(d));
    return `<tr data-hex="${esc(v.hex)}" class="${S.selected===v.hex?'sel':''}" title="${esc(airlineName(cs)||'')} ${esc(od)}">
      <td><span class="cs">${esc(cs)}</span>${od?`<div class="small">${esc(od)}</div>`:''}</td>
      <td>${a}</td><td>${d.track!=null?nf(d.track)+'°':'—'}</td><td>${nf(v.dist,1)} km</td></tr>`;
  }).join('');
  $('listBody').innerHTML = rows || `<tr><td colspan="4" class="small" style="padding:10px 4px">Sem aviões no alcance de ${S.rangeKm} km.</td></tr>`;
  // pedir rotas dos visíveis
  if(S.mode==='live') for(const v of vis){ const cs=(v.pl.data.flight||'').trim(); if(cs && !S.routes.has(cs) && !routeQueue.includes(cs)) routeQueue.push(cs); }
}
$('listBody').addEventListener('click', e=>{ const tr=e.target.closest('tr[data-hex]'); if(tr) select(tr.dataset.hex); });

function select(hex){
  S.selected = hex; renderList(); renderDetails();
  const pl=S.planes.get(hex); if(pl){ lookupAircraft(hex); const cs=(pl.data.flight||'').trim(); if(cs) lookupRoute(cs); }
  if(window.innerWidth<=1000) $('details').scrollIntoView({behavior:'smooth',block:'start'});
}

const LABELS = {
  hex:'Endereço ICAO (hex)', type:'Tipo de mensagem', flight:'Callsign', r:'Matrícula', t:'Tipo (ICAO)', desc:'Modelo', ownOp:'Proprietário / operador', year:'Ano',
  alt_baro:'Altitude barométrica', alt_geom:'Altitude geométrica (GNSS)', gs:'Velocidade solo', ias:'Velocidade indicada (IAS)', tas:'Velocidade real (TAS)', mach:'Mach',
  track:'Rumo (track)', track_rate:'Taxa de viragem', roll:'Inclinação (roll)', mag_heading:'Proa magnética', true_heading:'Proa verdadeira',
  baro_rate:'Razão vertical (baro)', geom_rate:'Razão vertical (GNSS)', squawk:'Squawk', emergency:'Emergência', category:'Categoria',
  nav_qnh:'QNH selecionado', nav_altitude_mcp:'Altitude selecionada (MCP)', nav_altitude_fms:'Altitude selecionada (FMS)', nav_heading:'Proa selecionada', nav_modes:'Modos do piloto automático',
  lat:'Latitude', lon:'Longitude', nic:'NIC', rc:'Raio de contenção', seen_pos:'Posição recebida há', seen:'Última mensagem há', version:'Versão ADS-B',
  nic_baro:'NIC baro', nac_p:'NACp', nac_v:'NACv', sil:'SIL', sil_type:'Tipo SIL', gva:'GVA', sda:'SDA', alert:'Alerta', spi:'SPI', mlat:'MLAT', tisb:'TIS-B',
  messages:'Mensagens recebidas', rssi:'Sinal (RSSI)', dbFlags:'Flags (militar/interesse)', wd:'Direção do vento', ws:'Velocidade do vento', oat:'Temp. exterior', tat:'Temp. total', gpsOkBefore:'GPS OK antes de', rr_lat:'Lat. aprox.', rr_lon:'Lon. aprox.', lastPosition:'Última posição'
};
function fmtVal(k,v){
  if(v==null||v==='') return '—';
  switch(k){
    case 'alt_baro': case 'alt_geom': case 'nav_altitude_mcp': case 'nav_altitude_fms':
      return v==='ground' ? 'No solo' : `${nf(v)} ft (${nf(v*FT_TO_M)} m)`;
    case 'gs': case 'ias': case 'tas': case 'ws': return `${nf(v)} kt (${nf(v*KM_PER_NM)} km/h)`;
    case 'track': case 'mag_heading': case 'true_heading': case 'nav_heading': case 'wd': return `${nf(v,1)}° ${cardinal(v)}`;
    case 'baro_rate': case 'geom_rate': return `${v>0?'+':''}${nf(v)} ft/min ${v>200?'↑ a subir':v<-200?'↓ a descer':'→ nivelado'}`;
    case 'lat': case 'lon': return nf(v,5);
    case 'seen': case 'seen_pos': return `${nf(v,1)} s`;
    case 'rssi': return `${nf(v,1)} dBFS`;
    case 'nav_qnh': return `${nf(v,1)} hPa`;
    case 'oat': case 'tat': return `${nf(v)} °C`;
    case 'category': return `${v} · ${CATEGORY[v]||''}`;
    case 'roll': case 'track_rate': return `${nf(v,2)}°${k==='track_rate'?'/s':''}`;
    case 'hex': return String(v).toUpperCase();
    case 'flight': return String(v).trim();
    case 'nav_modes': return Array.isArray(v)?v.join(', '):String(v);
    case 'dbFlags': return ({1:'Militar',2:'Interessante',4:'PIA',8:'LADD'})[v]||String(v);
    case 'lastPosition': return typeof v==='object' ? `${nf(v.lat,4)}, ${nf(v.lon,4)}` : String(v);
    default:
      if(Array.isArray(v)) return v.join(', ');
      if(typeof v==='object') return JSON.stringify(v);
      if(typeof v==='boolean') return v?'Sim':'Não';
      return typeof v==='number' ? nf(v,3) : String(v);
  }
}
function renderDetails(){
  const box=$('details'); const pl=S.planes.get(S.selected);
  if(!pl){ box.innerHTML = `<h2>Detalhes do avião</h2><div class="det-empty">${S.selected?'O avião selecionado saiu da cobertura.':'Toca num avião no radar (ou na lista) para ver toda a informação disponível.'}</div>`; return; }
  const d=pl.data, cs=callsignOf(d), r=routeFor(cs), pos=livePos(pl);
  const dist=haversineKm(S.center,pos), brg=bearingDeg(S.center,pos);
  const info = S.acinfo.get(S.selected);
  const air = airlineName(cs);
  const rStatus = S.routes.get((d.flight||'').trim());
  const ap = (o,lbl)=> o ? `<div class="ap"><div class="small">${lbl}</div><div class="code">${esc(o.iata_code||o.icao_code||'?')}</div><div class="nm" title="${esc(o.name||'')}">${esc(o.municipality||o.name||'')}${o.country_name?', '+esc(o.country_name):''}</div></div>` : `<div class="ap"><div class="small">${lbl}</div><div class="code">?</div></div>`;
  let h = `<h2>Detalhes do avião</h2>`;
  if(info && typeof info==='object' && info.url_photo_thumbnail) h += `<img class="photo" alt="" src="${esc(info.url_photo_thumbnail)}" onerror="this.remove()">`;
  h += `<div class="det-head"><div class="big">${esc(cs)}</div><div class="air">${esc(air|| (rStatus==='pending'?'A procurar companhia…':'Companhia desconhecida'))}</div>
    <div class="route">${ap(r?.origin,'ORIGEM')}<div class="arrow">✈</div>${ap(r?.destination,'DESTINO')}</div>
    ${!r && rStatus==='pending' ? '<div class="small" style="margin-top:6px">A procurar rota…</div>' : ''}
    ${!r && rStatus==='none' ? '<div class="small" style="margin-top:6px">Rota não disponível para este callsign.</div>' : ''}</div>`;
  const rows = [];
  const grp = t => rows.push(`<tr class="grp"><td colspan="2">${t}</td></tr>`);
  const kv = (k,v) => rows.push(`<tr><td>${esc(k)}</td><td>${v}</td></tr>`);
  grp('Relativo à nossa posição');
  kv('Distância', `${nf(dist,2)} km (${nf(dist/KM_PER_NM,1)} NM)`);
  kv('Azimute (de nós para o avião)', `${nf(brg,0)}° ${cardinal(brg)}`);
  const a=altFt(d); if(a) { const elev = toDeg(Math.atan2(a*FT_TO_M/1000, dist)); kv('Elevação no céu', `${nf(elev,1)}°`); }
  if(d.track!=null){ const rel=((d.track-((brg+180)%360))+540)%360-180; kv('Aproximação', Math.abs(rel)<45?'A aproximar-se':Math.abs(rel)>135?'A afastar-se':'A passar lateralmente'); }
  if(r){ grp('Voo'); kv('Companhia', esc(r.airline?.name||'—') + (r.airline?.iata?` (${esc(r.airline.iata)}/${esc(r.airline.icao)})`:''));
    if(r.airline?.country) kv('País da companhia', esc(r.airline.country));
    if(r.origin?.name) kv('Aeroporto de origem', esc(`${r.origin.name} (${r.origin.icao_code||''})`));
    if(r.destination?.name) kv('Aeroporto de destino', esc(`${r.destination.name} (${r.destination.icao_code||''})`));
    if(r.callsign_iata) kv('Nº de voo (IATA)', esc(r.callsign_iata)); }
  if(info && typeof info==='object'){ grp('Aeronave (registo)');
    [['registration','Matrícula'],['manufacturer','Fabricante'],['type','Modelo'],['icao_type','Tipo ICAO'],['registered_owner','Proprietário registado'],['registered_owner_country_name','País do registo'],['registered_owner_operator_flag_code','Código operador']].forEach(([k,l])=>{ if(info[k]) kv(l, esc(info[k])); });
  }
  grp('Dados ADS-B');
  const order = ['flight','hex','r','t','desc','ownOp','year','category','squawk','emergency','alt_baro','alt_geom','baro_rate','geom_rate','gs','ias','tas','mach','track','mag_heading','true_heading','track_rate','roll','nav_altitude_mcp','nav_altitude_fms','nav_heading','nav_qnh','nav_modes','wd','ws','oat','tat','lat','lon','seen_pos','seen','messages','rssi','type','version','dbFlags'];
  const done = new Set();
  for(const k of order){ if(d[k]!==undefined){ kv(LABELS[k]||k, esc(fmtVal(k,d[k]))); done.add(k);} }
  for(const k of Object.keys(d)){ if(done.has(k)||k.startsWith('_')) continue; kv(LABELS[k]||k, esc(fmtVal(k,d[k]))); }
  if(d.squawk==='7700'||d.squawk==='7600'||d.squawk==='7500') rows.unshift(`<tr><td colspan="2" style="color:var(--red);font-weight:700">⚠ SQUAWK ${d.squawk} — ${({7700:'Emergência',7600:'Falha de rádio',7500:'Interferência ilícita'})[d.squawk]}</td></tr>`);
  h += `<table class="kv">${rows.join('')}</table>`;
  if(d._demo) h += `<p class="small" style="margin-top:12px">Avião simulado (modo simulação).</p>`;
  else h += `<p class="small" style="margin-top:12px">Fontes: ${esc(S.source||'')} (ADS-B), adsbdb.com (rota/registo). Rotas por callsign podem estar desatualizadas.</p>`;
  box.innerHTML = h;
}

// ---------- radar (canvas) ----------
const cv=$('radar'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1, CX=0, CY=0, R=0, hitList=[];
function resize(){
  const wrap=$('wrap'); const rect=wrap.getBoundingClientRect();
  DPR = window.devicePixelRatio||1;
  W = rect.width-24; H = rect.height-24;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=H/2; R=Math.min(W,H)/2-26;
}
window.addEventListener('resize', resize);

function draw(now){
  ctx.clearRect(0,0,W,H);
  if(R<=20){ requestAnimationFrame(draw); return; }
  const sweep = ((now % SWEEP_PERIOD)/SWEEP_PERIOD)*360;
  // fundo
  const bg=ctx.createRadialGradient(CX,CY,0,CX,CY,R);
  bg.addColorStop(0,'#0b2215'); bg.addColorStop(1,'#04100a');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill();
  // anéis
  ctx.strokeStyle='rgba(61,255,138,.22)'; ctx.lineWidth=1;
  ctx.font='10px JetBrains Mono, monospace'; ctx.fillStyle='rgba(61,255,138,.55)'; ctx.textAlign='left';
  for(let i=1;i<=4;i++){
    const rr=R*i/4; ctx.beginPath(); ctx.arc(CX,CY,rr,0,Math.PI*2); ctx.stroke();
    ctx.fillText(`${nf(S.rangeKm*i/4, S.rangeKm*i/4<10?1:0)} km`, CX+4, CY-rr+12);
  }
  // cruz + marcas de graus
  ctx.beginPath(); ctx.moveTo(CX-R,CY); ctx.lineTo(CX+R,CY); ctx.moveTo(CX,CY-R); ctx.lineTo(CX,CY+R); ctx.strokeStyle='rgba(61,255,138,.13)'; ctx.stroke();
  for(let d=0; d<360; d+=10){
    const a=toRad(d), l = d%30===0?9:4;
    ctx.beginPath(); ctx.moveTo(CX+Math.sin(a)*R, CY-Math.cos(a)*R); ctx.lineTo(CX+Math.sin(a)*(R-l), CY-Math.cos(a)*(R-l));
    ctx.strokeStyle='rgba(61,255,138,.45)'; ctx.stroke();
  }
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='600 12px JetBrains Mono, monospace'; ctx.fillStyle='rgba(61,255,138,.85)';
  [['N',0],['E',90],['S',180],['O',270]].forEach(([t,d])=>{ const a=toRad(d); ctx.fillText(t, CX+Math.sin(a)*(R+14), CY-Math.cos(a)*(R+14)); });
  // rasto do varrimento
  ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.clip();
  const sa = toRad(sweep)-Math.PI/2;
  if(ctx.createConicGradient){
    const g = ctx.createConicGradient(sa - toRad(70), CX, CY);
    g.addColorStop(0,'rgba(61,255,138,0)'); g.addColorStop(70/360,'rgba(61,255,138,.28)'); g.addColorStop(70/360+0.0001,'rgba(61,255,138,0)'); g.addColorStop(1,'rgba(61,255,138,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(CX,CY); ctx.arc(CX,CY,R,sa-toRad(70),sa); ctx.closePath(); ctx.fill();
  } else {
    for(let i=0;i<35;i++){ ctx.fillStyle=`rgba(61,255,138,${0.008*(35-i)/35*8})`; ctx.beginPath(); ctx.moveTo(CX,CY); ctx.arc(CX,CY,R,sa-toRad((i+1)*2),sa-toRad(i*2)); ctx.fill(); }
  }
  // linha de varrimento
  ctx.strokeStyle='rgba(140,255,185,.95)'; ctx.lineWidth=2; ctx.shadowColor='#3dff8a'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX+Math.cos(sa)*R, CY+Math.sin(sa)*R); ctx.stroke();
  ctx.restore(); ctx.shadowBlur=0;
  // aviões
  hitList=[];
  const vis = visiblePlanes();
  for(const v of vis){
    const rr = v.dist/S.rangeKm*R, a=toRad(v.brg);
    const x=CX+Math.sin(a)*rr, y=CY-Math.cos(a)*rr;
    const delta = ((sweep - v.brg)+360)%360;          // graus desde a última passagem
    const glow = 1 - delta/360;                        // 1 = acabou de passar
    const alpha = 0.35 + 0.65*glow;
    const d=v.pl.data, sel = S.selected===v.hex;
    const emerg = ['7500','7600','7700'].includes(d.squawk);
    const col = emerg ? [255,93,93] : sel ? [95,227,255] : [61,255,138];
    const rgba = (al)=>`rgba(${col[0]},${col[1]},${col[2]},${al})`;
    // vetor de previsão (1 min)
    if(d.gs && d.track!=null){
      const km = d.gs*KM_PER_NM/60, pr = km/S.rangeKm*R, ta=toRad(d.track);
      ctx.strokeStyle=rgba(alpha*.5); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.sin(ta)*pr, y-Math.cos(ta)*pr); ctx.stroke();
    }
    // brilho quando o varrimento passa
    if(glow>0.85){ ctx.fillStyle=rgba((glow-0.85)*2.5); ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fill(); }
    // símbolo (avião orientado pelo rumo)
    ctx.save(); ctx.translate(x,y); ctx.rotate(toRad(d.track||0));
    ctx.fillStyle=rgba(alpha); ctx.beginPath();
    ctx.moveTo(0,-8); ctx.lineTo(1.6,-2); ctx.lineTo(7,1.5); ctx.lineTo(7,3); ctx.lineTo(1.6,1.5); ctx.lineTo(1.2,5.5); ctx.lineTo(3.5,7.5); ctx.lineTo(3.5,8.5); ctx.lineTo(0,7.5);
    ctx.lineTo(-3.5,8.5); ctx.lineTo(-3.5,7.5); ctx.lineTo(-1.2,5.5); ctx.lineTo(-1.6,1.5); ctx.lineTo(-7,3); ctx.lineTo(-7,1.5); ctx.lineTo(-1.6,-2); ctx.closePath(); ctx.fill();
    ctx.restore();
    if(sel){ ctx.strokeStyle=rgba(.9); ctx.lineWidth=1.5; ctx.strokeRect(x-12,y-12,24,24); }
    // etiqueta
    const cs=callsignOf(d), a2=altFt(d);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.font=`${sel?'700':'600'} 11px JetBrains Mono, monospace`; ctx.fillStyle=rgba(Math.max(alpha,sel?1:0.55));
    ctx.fillText(cs, x+11, y-3);
    ctx.font='10px JetBrains Mono, monospace'; ctx.fillStyle=rgba(Math.max(alpha*.8,0.45));
    const vr = d.baro_rate>200?'↑':d.baro_rate<-200?'↓':'';
    ctx.fillText(d.alt_baro==='ground'?'SOLO':`${a2!=null?'FL'+String(Math.round(a2/100)).padStart(3,'0'):'—'}${vr} ${d.gs?nf(d.gs)+'kt':''}`, x+11, y+9);
    hitList.push({hex:v.hex,x,y});
  }
  // centro (nós)
  ctx.fillStyle='#eafff1'; ctx.beginPath(); ctx.arc(CX,CY,3.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(234,255,241,.6)'; ctx.beginPath(); ctx.arc(CX,CY,7,0,Math.PI*2); ctx.stroke();
  if(!S.center){ ctx.fillStyle='#cfe9d8'; ctx.textAlign='center'; ctx.font='12px JetBrains Mono, monospace'; ctx.fillText('À espera da localização…', CX, CY+28); }
  requestAnimationFrame(draw);
}
cv.addEventListener('click', e=>{
  const r=cv.getBoundingClientRect(); const x=e.clientX-r.left, y=e.clientY-r.top;
  let best=null, bd=22;
  for(const h of hitList){ const dd=Math.hypot(h.x-x,h.y-y); if(dd<bd){bd=dd;best=h;} }
  if(best) select(best.hex);
});

// ---------- UI ----------
function updateBadge(){
  const b=$('modeBadge');
  if(S.mode==='demo'){ b.className='badge demo'; b.textContent='SIMULAÇÃO'; }
  else if(S.liveFailed){ b.className='badge err'; b.textContent='SEM DADOS'; }
  else { b.className='badge live'; b.textContent='AO VIVO · '+(S.source||'…'); }
  $('tLive').classList.toggle('on', S.mode==='live'); $('tDemo').classList.toggle('on', S.mode==='demo');
  $('srcInfo').innerHTML = S.mode==='live'
    ? `Fonte: ${S.source?esc(S.source):'a ligar…'} · atualiza a cada ${REFRESH_MS/1000} s.<br>Rotas e companhia: adsbdb.com`
    : 'Tráfego fictício gerado localmente para demonstração.';
  const last = S.lastFetch ? new Date(S.lastFetch).toLocaleTimeString('pt-PT') : '—';
  $('hud').innerHTML = `Alcance <b>${S.rangeKm} km</b> · ${S.center?`${nf(S.center.lat,4)}, ${nf(S.center.lon,4)}`:'sem posição'}<br>Atualizado: ${last}`;
}
function showNotice(html){ const n=$('notice'); n.innerHTML=html; n.style.display='block'; }
function hideNotice(){ $('notice').style.display='none'; }

function setMode(m, silent){
  S.mode=m; store.set('radar.mode', m);
  S.planes.clear(); S.routes.clear(); S.acinfo.clear(); routeQueue=[]; S.selected=null; renderDetails();
  if(m==='demo'){ if(S.center){ makeDemo(); S.lastFetch=Date.now(); } }
  else { hideNotice(); S.liveFailed=false; fetchLive(); }
  updateBadge(); renderList();
}
$('tLive').onclick=()=>setMode('live'); $('tDemo').onclick=()=>setMode('demo');

$('ranges').addEventListener('click', e=>{
  const b=e.target.closest('button[data-r]'); if(!b) return;
  S.rangeKm=+b.dataset.r; store.set('radar.range', S.rangeKm);
  [...$('ranges').children].forEach(x=>x.classList.toggle('on', x===b));
  if(S.mode==='live') fetchLive(); else if(S.center){ makeDemo(); }
  renderList(); updateBadge();
});
function setCenter(lat,lon,label){
  S.center={lat,lon}; S.centerLabel=label||''; store.set('radar.center', S.center);
  $('lat').value=lat.toFixed(5); $('lon').value=lon.toFixed(5);
  $('locInfo').textContent = label ? label : 'Centro definido.';
  if(S.mode==='live') fetchLive(); else makeDemo();
  renderList(); updateBadge();
}
$('applyLoc').onclick=()=>{
  const la=parseFloat($('lat').value.replace(',','.')), lo=parseFloat($('lon').value.replace(',','.'));
  if(isNaN(la)||isNaN(lo)||Math.abs(la)>90||Math.abs(lo)>180){ $('locInfo').textContent='Coordenadas inválidas.'; return; }
  setCenter(la,lo,'Coordenadas manuais');
};
function askGps(){
  if(!navigator.geolocation){ $('locInfo').textContent='Geolocalização não suportada neste navegador. Introduz as coordenadas.'; return; }
  $('locInfo').textContent='A pedir localização…';
  try{
    navigator.geolocation.getCurrentPosition(
      p=>setCenter(p.coords.latitude, p.coords.longitude, `GPS (±${Math.round(p.coords.accuracy)} m)`),
      err=>{ $('locInfo').textContent='Localização indisponível ('+(err.message||'recusada')+'). Introduz latitude e longitude acima.';
             if(!S.center) setCenter(DEFAULT_CENTER.lat, DEFAULT_CENTER.lon, DEFAULT_CENTER.label+' — define a tua posição acima'); },
      {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  }catch(e){ if(!S.center) setCenter(DEFAULT_CENTER.lat, DEFAULT_CENTER.lon, DEFAULT_CENTER.label); }
}
$('gpsBtn').onclick=askGps;

// ciclo
setInterval(()=>{ if(S.mode==='live') fetchLive(); else if(S.center){ demoTick(); S.lastFetch=Date.now(); updateBadge(); } }, REFRESH_MS);
setInterval(()=>{ renderList(); if(S.selected) renderDetails(); $('clock').textContent=new Date().toLocaleTimeString('pt-PT'); }, 1000);

// arranque
[...$('ranges').children].forEach(x=>x.classList.toggle('on', +x.dataset.r===S.rangeKm));
resize(); requestAnimationFrame(draw); updateBadge();
if(S.center){ setCenter(S.center.lat, S.center.lon, 'Última posição guardada'); askGps(); }
else askGps();
})();
</script>
